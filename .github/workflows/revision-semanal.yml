name: Revisión semanal HemoPocket

# Revisión automática de salud, cada semana, en la nube (no depende de ninguna sesión abierta).
# Corrige sola lo que es seguro (p. ej., la versión). Si encuentra algo:
#  - la app se lo muestra a los administradores al abrirla (qué se corrigió y qué falta, con su código);
#  - abre o actualiza un "issue" en GitHub con el detalle.
# Incluye una prueba en navegador: abre la app y entra en cada apartado para cazar errores de ejecución.
# También se puede lanzar a mano desde la pestaña Actions (botón "Run workflow").

on:
  schedule:
    - cron: '17 7 * * 1'   # lunes, ~07:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  revision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Navegador para la prueba de carga
        continue-on-error: true
        run: |
          npm i --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Ejecutar revisión y autocorregir lo seguro
        id: check
        continue-on-error: true
        run: |
          node scripts/health-check.mjs --fix | tee revision.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Guardar autocorrecciones + informe en el repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -q -- revision.txt node_modules 2>/dev/null || true
          # Si lo único que cambia es la fecha del informe, no se guarda (sin commits vacíos cada semana).
          if git diff --cached --quiet -- . ':(exclude)revisiones/ultima.json' && [ -z "$(git diff --cached -U0 -- revisiones/ultima.json | grep '^[+-] ' | grep -v '"fecha"')" ]; then
            git reset -q -- revisiones/ultima.json
          fi
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "Revisión automática: autocorrecciones seguras + informe"
            git push origin HEAD:main
          fi

      - name: Abrir o actualizar aviso si hay problemas
        if: steps.check.outputs.exit != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cuerpo = fs.readFileSync('revision.txt', 'utf8');
            const marca = '<!-- revision-semanal-hemopocket -->';
            const titulo = '⚠️ Revisión: hay algo que necesita aprobación de un administrador';
            const body = marca + '\n\n' + cuerpo +
              '\n\n_Generado automáticamente por la acción «Revisión semanal HemoPocket». ' +
              'Cuando se corrijan los problemas, cierra este aviso (la próxima revisión limpia no lo reabre)._';
            const { owner, repo } = context.repo;
            const previos = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existente = previos.data.find(i => (i.body || '').includes(marca));
            if (existente) {
              await github.rest.issues.update({ owner, repo, issue_number: existente.number, title: titulo, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: titulo, body });
            }

      - name: Fallar el job si la revisión encontró problemas
        if: steps.check.outputs.exit != '0'
        run: |
          echo "La revisión detectó problemas (ver el issue abierto)."
          exit 1
