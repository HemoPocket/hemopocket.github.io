name: Desplegar Firebase (funciones + reglas)

# Despliega automáticamente las Cloud Functions y las reglas de Firestore cuando
# cambian, sin necesidad de terminal. Requiere el secreto FIREBASE_SERVICE_ACCOUNT
# (clave JSON de una cuenta de servicio con permiso de despliegue). Mientras no exista
# ese secreto, el workflow no falla: solo deja un aviso.

on:
  push:
    branches: [main]
    paths:
      - 'firebase/functions/**'
      - 'firebase/firestore.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-firebase.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Aviso si falta la clave de servicio
        if: env.HAS_SA != 'true'
        run: echo "::warning::Falta el secreto FIREBASE_SERVICE_ACCOUNT. Añádelo en Settings -> Secrets and variables -> Actions y vuelve a ejecutar este workflow."

      - name: Descargar el código
        if: env.HAS_SA == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Las funciones solo se redespliegan si han cambiado (o al lanzarlo a mano). Así un problema
      # con las funciones no impide publicar las reglas de seguridad, que van siempre primero.
      - name: Comprobar si han cambiado las funciones
        id: cambios
        if: env.HAS_SA == 'true'
        env:
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          AHORA: ${{ github.sha }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            echo "funciones=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$ANTES" "$AHORA" 2>/dev/null | grep -qE '^(firebase/functions/|firebase\.json$|\.firebaserc$)'; then
            echo "funciones=true" >> "$GITHUB_OUTPUT"
          else
            echo "funciones=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar Node 22
        if: env.HAS_SA == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar firebase-tools
        if: env.HAS_SA == 'true'
        run: npm install -g firebase-tools

      - name: Desplegar reglas de Firestore
        if: env.HAS_SA == 'true'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          firebase deploy --only firestore:rules --project hemopocket --non-interactive --force

      - name: Desplegar funciones
        if: env.HAS_SA == 'true' && steps.cambios.outputs.funciones == 'true'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npm --prefix firebase/functions install
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          firebase deploy --only functions --project hemopocket --non-interactive --force
