name: Desplegar Firebase (funciones + reglas)

# Despliega automáticamente las Cloud Functions y las reglas de Firestore cuando
# cambian, sin necesidad de terminal. Requiere el secreto FIREBASE_SERVICE_ACCOUNT
# (clave JSON de una cuenta de servicio con permiso de despliegue). Mientras no exista
# ese secreto, el workflow no falla: solo deja un aviso.

on:
  push:
    branches: [main]
    paths:
      - 'firebase/functions/**'
      - 'firebase/firestore.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-firebase.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Aviso si falta la clave de servicio
        if: env.HAS_SA != 'true'
        run: echo "::warning::Falta el secreto FIREBASE_SERVICE_ACCOUNT. Añádelo en Settings -> Secrets and variables -> Actions y vuelve a ejecutar este workflow."

      - name: Descargar el código
        if: env.HAS_SA == 'true'
        uses: actions/checkout@v4

      - name: Preparar Node 20
        if: env.HAS_SA == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar firebase-tools y dependencias
        if: env.HAS_SA == 'true'
        run: |
          npm install -g firebase-tools
          npm --prefix firebase/functions install

      - name: Desplegar funciones y reglas
        if: env.HAS_SA == 'true'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          firebase deploy --only functions,firestore:rules --project hemopocket --non-interactive --force
